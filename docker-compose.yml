# Local deployment: FastAPI backend + Streamlit frontend from one image.
# Usage: cp .env.example .env  (set GEMINI_API_KEY), then `docker compose up --build`.
services:
  backend:
    build: .
    image: legalease:latest
    env_file: .env
    environment:
      CORS_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    image: legalease:latest
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      BACKEND_URL: "http://backend:8000"
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
